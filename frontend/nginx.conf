# ─────────────────────────────────────────────────────────────────────────────
#  nginx — serves the SPA and fronts the API.
#
#  SAME-ORIGIN BY DESIGN. The browser only ever talks to THIS server: static
#  files come from disk, and /v1, /docs, /health are proxied to the app
#  container. Because everything shares one origin, there is no CORS at all —
#  no preflights, no Access-Control headers to get subtly wrong, and the
#  frontend's fetch("/v1/me") works unchanged from the single-image setup.
#
#  If you instead pointed the SPA at http://app:8000 directly, the browser could
#  not resolve that hostname (it's a compose-internal name) AND you would need
#  CORS. Proxying is what avoids both.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the JS bundle (~660 KB → ~190 KB on the wire).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API surface, proxied to the FastAPI container ────────────────────────
    #  All FOUR of these matter:
    #    /v1           the gateway itself
    #    /health       liveness (also used by compose's healthcheck)
    #    /docs,/redoc  Swagger UI — proxy it or the docs 404 behind nginx
    #    /openapi.json Swagger fetches this; without it /docs renders empty
    location ~ ^/(v1|health|docs|redoc|openapi\.json) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming chat completions are Server-Sent Events. Without these three
        # lines nginx BUFFERS the response and the client gets the whole reply in
        # one lump at the end — the stream appears to hang, then dump. This is
        # the single most common way an LLM proxy breaks behind nginx.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # An LLM call can legitimately take a while. nginx's 60s default would
        # cut off long generations mid-stream.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Hashed assets: immutable, cache hard ────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    #  react-router owns /models, /admin, /providers… Those paths are not files
    #  on disk, so a hard refresh or deep link must still return index.html.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must NOT be cached: it names the hashed bundles, so a stale
        # copy would keep pointing at JS that no longer exists after a redeploy.
        add_header Cache-Control "no-cache";
    }
}
