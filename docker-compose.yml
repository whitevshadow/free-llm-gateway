# ─────────────────────────────────────────────────────────────
# Multi-LLM Gateway — PostgreSQL + API gateway.
#
#   docker compose up -d --build
#   → http://localhost:8000        OpenAI-compatible gateway (/v1, /docs)
#   → PostgreSQL on the internal network (service: postgres)
#
# One-off maintenance (run manually, inside the app container):
#   docker compose exec app python -m app.scripts.migrate_sqlite_to_postgres
#   docker compose exec app python -m app.scripts.probe_models
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — primary application database ────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=gateway
      - POSTGRES_PASSWORD=gateway
      - POSTGRES_DB=gateway
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # ── LiteLLM Smart Router + FastAPI Backend (API only) ───────
  app:
    build:
      context: ./backend
    image: multi-llm-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # Primary DB is now PostgreSQL. `postgres` resolves on the compose network.
      - DATABASE_URL=postgresql+psycopg2://gateway:gateway@postgres:5432/gateway
      # Serve the common-model spine (populated by the discover/probe/derive
      # pipeline). Set to 'yaml' to fall back to the static bootstrap pool.
      - ROUTER_SOURCE=${ROUTER_SOURCE:-db}
      # Gateway auth for the public /v1 API. Values come from the root .env.
      - REQUIRE_GATEWAY_AUTH=${REQUIRE_GATEWAY_AUTH:-true}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
    volumes:
      # Keep the old SQLite volume mounted so its data can be migrated across.
      - app_data:/app/data
      # Live-mount the model pool so YAML tweaks apply on a router reload (no rebuild).
      - ./backend/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  app_data:
  pg_data:
