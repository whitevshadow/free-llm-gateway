# ──────────────────────────────────────────────────────────────────────────
# Free-Provider Model Pool  —  source of truth for litellm.Router
# ──────────────────────────────────────────────────────────────────────────
# Each item in `model_list` is ONE deployment: a (virtual model name) bound to a
# concrete (provider/model + API key). List the SAME `model_name` multiple times
# — once per key and once per equivalent provider — and the Router rotates across
# them, cools down any that hit a 429 / quota wall, and fails over to the
# `fallbacks` chain when a whole virtual model is exhausted.
#
# ┌────────────────────────────────────────────────────────────────────────┐
# │ RELIABILITY CORE — these 4 models are each served by ALL THREE providers │
# │ you have keys for (Groq + NVIDIA + OpenRouter). A request only fails if   │
# │ every provider is down AND the cross-model fallback chain is exhausted.   │
# │   • gpt-oss-120b   • gpt-oss-20b   • llama-3.3-70b   • llama-3.1-8b        │
# │ `auto` (the default) load-balances llama-3.3-70b across all three.        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Keys are referenced as `os.environ/<VAR>`. Deployments whose env var is unset
# are skipped automatically at load time. A manual availability probe
# (app/scripts/probe_models.py) additionally hides routes that don't respond, so
# dead routes (e.g. a revoked OpenRouter key) never slow a request down.
# ──────────────────────────────────────────────────────────────────────────

model_list:
  # ════════════════════════════════════════════════════════════════════════
  # auto  — DEFAULT model. llama-3.3-70b spread across all three providers, so
  #         "just give me an answer" is the most redundant route in the pool.
  #         Claude Code's claude-* names and any unknown model map here.
  # ════════════════════════════════════════════════════════════════════════
  - model_name: auto
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY_1
      rpm: 30
  - model_name: auto
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: os.environ/NVIDIA_API_KEY_1
  - model_name: auto
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY_1
  # Optional extra backends (activate automatically once their key is set).
  - model_name: auto
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY_2
      rpm: 30
  - model_name: auto
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_1
  - model_name: auto
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY_1

  # ════════════════════════════════════════════════════════════════════════
  # gpt-oss-120b  — OpenAI open weights.  Groq + NVIDIA + OpenRouter
  # ════════════════════════════════════════════════════════════════════════
  - model_name: gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY_1
      rpm: 30
  - model_name: gpt-oss-120b
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b
      api_key: os.environ/NVIDIA_API_KEY_1
  - model_name: gpt-oss-120b
    litellm_params:
      model: openrouter/openai/gpt-oss-120b:free
      api_key: os.environ/OPENROUTER_API_KEY_1
  - model_name: gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY_2
      rpm: 30
  - model_name: gpt-oss-120b
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY_1

  # ════════════════════════════════════════════════════════════════════════
  # gpt-oss-20b  — smaller/faster OpenAI open weights.  Groq + NVIDIA + OpenRouter
  # ════════════════════════════════════════════════════════════════════════
  - model_name: gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY_1
      rpm: 30
  - model_name: gpt-oss-20b
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-20b
      api_key: os.environ/NVIDIA_API_KEY_1
  - model_name: gpt-oss-20b
    litellm_params:
      model: openrouter/openai/gpt-oss-20b:free
      api_key: os.environ/OPENROUTER_API_KEY_1
  - model_name: gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY_2
      rpm: 30

  # ════════════════════════════════════════════════════════════════════════
  # llama-3.3-70b  — Meta Llama 3.3 70B.  Groq + NVIDIA + OpenRouter
  # ════════════════════════════════════════════════════════════════════════
  - model_name: llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY_1
      rpm: 30
  - model_name: llama-3.3-70b
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: os.environ/NVIDIA_API_KEY_1
  - model_name: llama-3.3-70b
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY_1
  - model_name: llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY_2
      rpm: 30

  # ════════════════════════════════════════════════════════════════════════
  # llama-3.1-8b  — small, fast Llama 3.1 8B.  Groq + NVIDIA + OpenRouter
  # ════════════════════════════════════════════════════════════════════════
  - model_name: llama-3.1-8b
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY_1
      rpm: 30
  - model_name: llama-3.1-8b
    litellm_params:
      model: nvidia_nim/meta/llama-3.1-8b-instruct
      api_key: os.environ/NVIDIA_API_KEY_1
  - model_name: llama-3.1-8b
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct
      api_key: os.environ/OPENROUTER_API_KEY_1
  - model_name: llama-3.1-8b
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY_2
      rpm: 30

  # ════════════════════════════════════════════════════════════════════════
  # SECONDARY MODELS — handy extras; also serve as fallback targets.
  # ════════════════════════════════════════════════════════════════════════
  # deepseek  — DeepSeek across free routes. NVIDIA (deepseek-v4) is the only
  # route that reliably answers today; Groq/OpenRouter/direct back it up.
  - model_name: deepseek
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-flash
      api_key: os.environ/NVIDIA_API_KEY_1
  - model_name: deepseek
    litellm_params:
      model: groq/deepseek-r1-distill-llama-70b
      api_key: os.environ/GROQ_API_KEY_1
      rpm: 30
  - model_name: deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY_1
  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY_1

  # qwen  — Alibaba Qwen3
  - model_name: qwen
    litellm_params:
      model: groq/qwen/qwen3-32b
      api_key: os.environ/GROQ_API_KEY_1
      rpm: 30
  - model_name: qwen
    litellm_params:
      model: nvidia_nim/qwen/qwen3-next-80b-a3b-instruct
      api_key: os.environ/NVIDIA_API_KEY_1
  - model_name: qwen
    litellm_params:
      model: openrouter/qwen/qwen3-235b-a22b:free
      api_key: os.environ/OPENROUTER_API_KEY_1

  # mistral  — Mistral family via NVIDIA NIM (large → medium → small).
  - model_name: mistral
    litellm_params:
      model: nvidia_nim/mistralai/mistral-large-3-675b-instruct-2512
      api_key: os.environ/NVIDIA_API_KEY_1
  - model_name: mistral
    litellm_params:
      model: nvidia_nim/mistralai/mistral-medium-3.5-128b
      api_key: os.environ/NVIDIA_API_KEY_1
  - model_name: mistral
    litellm_params:
      model: nvidia_nim/mistralai/mistral-small-4-119b-2603
      api_key: os.environ/NVIDIA_API_KEY_1

  # gemini-flash  — Google AI Studio free tier (activates when GEMINI key set)
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_1
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY_1

  # local  — Ollama, no key required (always available if running)
  - model_name: local
    litellm_params:
      model: ollama/llama3
      api_base: os.environ/OLLAMA_API_BASE

  # ════════════════════════════════════════════════════════════════════════
  # EMBEDDINGS — NVIDIA NIM free endpoints, served via POST /v1/embeddings.
  #
  # NVIDIA's retrieval models are ASYMMETRIC: they require an `input_type` of
  # "query" or "passage". We default to "query" here so plain OpenAI clients
  # work out of the box; when embedding documents for an index, pass
  # `"input_type": "passage"` in the request body to override.
  #
  # Embedding models are NOT interchangeable (different dimensions / vector
  # spaces), so each gets its own virtual name and NO cross-model fallbacks.
  # `embed` is the default the /v1/embeddings endpoint falls back to.
  # ════════════════════════════════════════════════════════════════════════
  # embed — DEFAULT. Multilingual long-document QA retrieval (26 languages).
  - model_name: embed
    litellm_params:
      model: nvidia_nim/nvidia/llama-nemotron-embed-1b-v2
      api_key: os.environ/NVIDIA_API_KEY_1
      encoding_format: float
      input_type: query
    model_info:
      mode: embedding

  # nemotron-embed — same model as `embed`, under its explicit name.
  - model_name: nemotron-embed
    litellm_params:
      model: nvidia_nim/nvidia/llama-nemotron-embed-1b-v2
      api_key: os.environ/NVIDIA_API_KEY_1
      encoding_format: float
      input_type: query
    model_info:
      mode: embedding

  # nemotron-embed-vl — multimodal QA retrieval (text queries ↔ doc images).
  - model_name: nemotron-embed-vl
    litellm_params:
      model: nvidia_nim/nvidia/llama-nemotron-embed-vl-1b-v2
      api_key: os.environ/NVIDIA_API_KEY_1
      encoding_format: float
      input_type: query
    model_info:
      mode: embedding

  # nv-embedqa-e5-v5 — English QA retrieval, 1024-dim.
  - model_name: nv-embedqa-e5-v5
    litellm_params:
      model: nvidia_nim/nvidia/nv-embedqa-e5-v5
      api_key: os.environ/NVIDIA_API_KEY_1
      encoding_format: float
      input_type: query
    model_info:
      mode: embedding

  # nv-embed-v1 — general-purpose text embeddings (symmetric, no input_type;
  # non-commercial license).
  - model_name: nv-embed-v1
    litellm_params:
      model: nvidia_nim/nvidia/nv-embed-v1
      api_key: os.environ/NVIDIA_API_KEY_1
      encoding_format: float
    model_info:
      mode: embedding

  # bge-m3 — BAAI multilingual dense retrieval, 1024-dim.
  # NOTE: NVIDIA's hosted bge-m3 currently returns errors for every request
  # (as of 2026-07); kept here so it activates when NVIDIA fixes the endpoint.
  - model_name: bge-m3
    litellm_params:
      model: nvidia_nim/baai/bge-m3
      api_key: os.environ/NVIDIA_API_KEY_1
      encoding_format: float
      input_type: query
    model_info:
      mode: embedding

# ──────────────────────────────────────────────────────────────────────────
# Router behaviour. These map to litellm.Router(**router_settings).
# Tuned for resilience: many retries across deployments, fast cooldown recovery,
# and cross-model fallbacks among the reliability core.
# ──────────────────────────────────────────────────────────────────────────
router_settings:
  routing_strategy: usage-based-routing-v2   # spread load by tokens/min used
  num_retries: 4                             # retry across deployments on failure
  cooldown_time: 30                          # secs a deployment is benched after fails
  allowed_fails: 3                           # tolerate transient blips before benching
  # Whole-virtual-model fallbacks: when every deployment of a model is exhausted,
  # cascade to the next. The 4 reliability-core models all back each other up.
  fallbacks:
    - {"auto": ["llama-3.3-70b", "gpt-oss-120b", "gpt-oss-20b", "llama-3.1-8b", "qwen", "gemini-flash"]}
    - {"gpt-oss-120b": ["gpt-oss-20b", "llama-3.3-70b", "llama-3.1-8b", "qwen", "gemini-flash"]}
    - {"gpt-oss-20b": ["llama-3.1-8b", "llama-3.3-70b", "gpt-oss-120b", "qwen", "gemini-flash"]}
    - {"llama-3.3-70b": ["gpt-oss-120b", "llama-3.1-8b", "gpt-oss-20b", "qwen", "gemini-flash"]}
    - {"llama-3.1-8b": ["llama-3.3-70b", "gpt-oss-20b", "gpt-oss-120b", "qwen", "gemini-flash"]}
    - {"deepseek": ["qwen", "llama-3.3-70b", "gpt-oss-120b", "gemini-flash"]}
    - {"mistral": ["llama-3.3-70b", "qwen", "gpt-oss-120b", "gemini-flash"]}
    - {"qwen": ["llama-3.3-70b", "gpt-oss-120b", "gemini-flash"]}
    - {"gemini-flash": ["llama-3.3-70b", "gpt-oss-120b"]}
